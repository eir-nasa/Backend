name: EIR Backend CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate OpenAPI and lock
        run: python -m orchestration.validate_contract
      - name: Lint
        run: python -m ruff check src tests orchestration
      - name: Run tests
        run: python -m pytest -q tests
      - name: Require backend tests for implementation
        run: |
          if find src/eir -type f -name '*.py' ! -name '__init__.py' | grep -q .; then
            find tests -maxdepth 1 -name 'test_backend_*.py' | grep -q . || { echo 'Missing backend tests'; exit 1; }
          fi
